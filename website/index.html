<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 50px;
        }
        .container {
            background: rgba(128, 128, 128, 0.5); /* Gray & Transparent */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            width: 300px;
            margin: auto;
        }
        h2 {
            color: #333;
        }
        .login-btn {
            background-color: #ff8500; /* Orange */
            color: white;
            font-size: 16px;
            cursor: pointer;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.6);
            text-decoration: none;
            display: inline-block;
        }
        .login-btn:hover {
            background-color: #e67300;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome</h2>
        <a href="login.html" class="login-btn">Login</a>
    </div>
</body>
</html>
