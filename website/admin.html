<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: rgba(128, 128, 128, 0.5);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            width: 300px;
            margin: auto;
        }
        h2 {
            color: #333;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        input {
            text-align: center;
        }
        button {
            background-color: #ff8500;
            color: white;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.6);
            border: none;
        }
        button:hover {
            background-color: #e67300;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
        }
        .amount {
            color: #ff8500;
            font-weight: bold;
        }
    </style>
    <script>
        function calculateShare() {
            let amount = parseFloat(document.getElementById("amount").value);
            if (isNaN(amount) || amount <= 0) {
                document.getElementById("result").innerHTML = "Please enter a valid amount.";
                return;
            }

            let shares = {
                "Hendri": 0.2,
                "Sepp": 0.266,
                "Jaakob": 0.266,
                "Birk": 0.266
            };

            let output = "<h3>Shares:</h3><ul>";
            for (let person in shares) {
                output += `<li>${person}: <span class="amount">${(amount * shares[person]).toFixed(2)} €</span></li>`;
            }
            output += "</ul>";
            document.getElementById("result").innerHTML = output;
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Admin Panel - Calculator</h2>
        <input type="number" id="amount" min="0" step="0.01" placeholder="Enter total amount (€)">
        <button onclick="calculateShare()">Calculate</button>
        <div id="result"></div>
    </div>
</body>
</html>
